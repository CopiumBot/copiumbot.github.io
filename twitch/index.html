<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopeBot - Twitch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon" sizes="48x48">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="modalContainer"></div>

    <header class="header d-flex justify-content-between align-items-center">
        <h1 class="logo my-0">
            <a href="../index.html">
                CopeBot
            </a>
        </h1>
        <div class="statusContainer">
            <span class="statusDot" id="statusDot"></span>
            <span id="connectionStatus">Not Connected</span>
        </div>
    </header>

    <div class="d-flex flex-grow-1">

        <nav class="sidebar d-flex flex-column">
            <button class="btn" id="ttsButton">
                <i class="fa-solid fa-volume-high"></i>
                Text To Speech
            </button>

            <button class="btn" id="moderationButton">
                <i class="fa-solid fa-shield-halved"></i>
                Moderation
            </button>

            <button class="btn" id="commandsButton">
                <i class="fa-solid fa-code"></i>
                Commands
            </button>

            <button class="btn" id="notificationsButton">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </button>

            <button class="authorize" id="authorize">
                Authorize
            </button>
        </nav>

        <main class="contentArea">
            <div class="panel chatContainer" id="chatMessages" style="width: 80%; height: 100%; overflow-y: auto;">
            </div>

            <div class="d-flex flex-column" style="width: 20%; height: 100%; gap: 1.5rem;">

                
                <div class="panel list" id="chatters" style="height: calc(50% - 0.75rem);">
                </div>
                <div class="panel list" id="followers" style="height: calc(50% - 0.75rem); padding-top: 1rem;">
                </div>

            </div>
        </main>

    </div>
    
    <script src="Auth.js"></script>
    <script src="CommandHandler.js"></script>
    <script src="Logger.js"></script>
    <script src="CopeTwitch.js"></script>
    <script src="UiManager.js"></script>

    <script src="script.js"></script>
</body>
</html>
